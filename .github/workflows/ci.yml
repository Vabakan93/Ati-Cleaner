name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
     
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
    
      - name: Run tests
        run: swift test

      - name: Release build
        run: swift build -c release
        
